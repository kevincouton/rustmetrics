[package]
name = "rustmetrics"
version = "0.1.0"
edition = "2021"
authors = ["Kevin Couton"]
description = "Aggregates test coverage, dead code, and function-size metrics for Rust projects."
license = "MIT OR Apache-2.0"
repository = "https://github.com/kevincouton/rustmetrics"
homepage = "https://github.com/kevincouton/rustmetrics"
readme = "README.md"
keywords = ["metrics", "coverage", "dead-code", "ci", "code-quality"]
categories = ["development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
walkdir = "2.5"
tree-sitter = "0.27"
tree-sitter-rust = "0.23"
thiserror = "1.0"
anyhow = "1.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
